<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="week5_ex01_style.css" />
    <title>Product Showcase</title>
  </head>
  <body>
    <header>
      <h1>Our Products</h1>
    </header>
    <main class="product-grid">
      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=300&h=200&fit=crop"
          alt="Product 1"
        />
        <h2>jacket</h2>
        <p class="price">R 299.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1542272604-787c3835535d?w=300&h=200&fit=crop"
          alt="Product 2"
        />
        <h2>jeans</h2>
        <p class="price">R 199.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300&h=200&fit=crop"
          alt="Product 3"
        />
        <h2>tshirt</h2>
        <p class="price">R 499.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&h=200&fit=crop"
          alt="Product 4"
        />
        <h2>shoes</h2>
        <p class="price">R 149.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1624222247344-550fb60583dc?w=300&h=200&fit=crop"
          alt="Product 5"
        />
        <h2>belts</h2>
        <p class="price">R 349.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=300&h=200&fit=crop"
          alt="Product 6"
        />
        <h2>caps</h2>
        <p class="price">R 249.99</p>
        <button>Add to Cart</button>
      </div>
    </main>
  </body>
</html>
